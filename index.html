<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páginas do Nosso Amor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; /* Fundo escuro elegante */
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; 
        }

        /* --- MENUS E TRANSIÇÕES --- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .hidden-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Cards do Menu */
        .menu-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .menu-card:hover, .menu-card:active {
            transform: translateY(-3px) scale(1.02);
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }

        /* --- ENVELOPE (DESIGN REALISTA) --- */
        .envelope-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 240px;
            perspective: 1200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .envelope-container:hover { transform: scale(1.03); }

        .env-back {
            position: absolute; inset: 0;
            background-color: #0a192f; 
            border-radius: 6px;
            box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .env-letter-stub {
            position: absolute; bottom: 8px; left: 4%;
            width: 92%; height: 200px;
            background-color: #e8d5b5; 
            background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0,0,0,0.15) 31px);
            border-radius: 4px; z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .env-left {
            position: absolute; top: 0; left: 0;
            width: 50.5%; height: 100%;
            background-color: #1a4279; 
            clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 3;
            border-bottom-left-radius: 6px;
        }

        .env-right {
            position: absolute; top: 0; right: 0;
            width: 50.5%; height: 100%;
            background-color: #143563; 
            clip-path: polygon(100% 0, 100% 100%, 0 50%); z-index: 3;
            border-bottom-right-radius: 6px;
        }

        .env-bottom {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 51%;
            background-color: #12315b; 
            clip-path: polygon(0 100%, 50% 0, 100% 100%); z-index: 4;
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
        }

        .env-flap-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 51%; transform-origin: top; z-index: 5;
        }

        .env-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1f4b87; 
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top-left-radius: 6px; border-top-right-radius: 6px;
        }

        .wax-seal {
            position: absolute; bottom: -20px; left: 50%;
            transform: translateX(-50%); width: 44px; height: 44px;
            background: radial-gradient(circle at 30% 30%, #dc2626, #991b1b, #7f1d1d);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            color: #fca5a5; font-size: 22px;
        }

        /* Animações Envelope */
        .envelope-container.open .env-flap-wrapper { transform: rotateX(180deg); z-index: 1 !important; transition: transform 0.6s ease-in-out 0s, z-index 0s 0.3s; }
        .envelope-container.open .env-letter-stub { transform: translateY(-80%); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s; }
        .envelope-container:not(.open) .env-flap-wrapper { transform: rotateX(0deg); z-index: 5 !important; transition: transform 0.6s ease-in-out 0.4s, z-index 0s 0.65s; }
        .envelope-container:not(.open) .env-letter-stub { transform: translateY(0); transition: transform 0.4s ease-in-out 0s; }
        .envelope-container.open .instruction { opacity: 0; }

        /* --- ESTILOS DA FOLHA DE TEXTO --- */
        .paper-lines {
            background-color: #e8d5b5; 
            background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0, 0, 0, 0.4) 31px);
            background-attachment: local; 
            padding: 31px 24px;
            line-height: 31px; 
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #1e293b;
        }
        .header-capitulo { text-align: center; font-size: 20px; font-weight: 700; line-height: 31px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; font-family: 'Inter', sans-serif; }
        .header-titulo { text-align: center; font-size: 34px; font-weight: 700; line-height: 62px; color: #0f172a; }
        .header-data { text-align: right; font-size: 16px; line-height: 31px; color: #64748b; margin-bottom: 31px; font-family: 'Inter', sans-serif; }

        /* --- ESTILOS DA GALERIA DE FOTOS (POLAROID) --- */
        .photo-album {
            background-color: #0f172a;
            padding: 24px;
            font-family: 'Inter', sans-serif;
        }
        .polaroid {
            background: #fff;
            padding: 12px 12px 36px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-radius: 3px;
            transition: transform 0.3s ease;
        }
        .polaroid:hover {
            transform: scale(1.03) rotate(0deg) !important;
            z-index: 10;
        }
        .polaroid-caption {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            color: #1e293b;
            text-align: center;
            margin-top: 10px;
            line-height: 1.2;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

    <!-- ECRÃ 1: MENU PRINCIPAL -->
    <div id="screen-menu" class="screen">
        <h1 class="text-3xl text-slate-100 mb-1 font-bold font-['Playfair_Display']">Páginas do Nosso Amor</h1>
        <p class="text-slate-400 mb-6 text-xs tracking-widest uppercase">Escolhe uma memória para ler</p>
        
        <div id="menu-list" class="w-full max-w-md px-6 flex flex-col gap-3 overflow-y-auto hide-scrollbar max-h-[70vh]">
            <!-- Inserido dinamicamente pelo JS -->
        </div>
    </div>

    <!-- ECRÃ 2: ENVELOPE -->
    <div id="screen-envelope" class="screen hidden-screen">
        <button id="btn-voltar" class="absolute top-8 left-6 text-slate-400 hover:text-white text-xs flex items-center gap-2 transition-colors z-10 uppercase tracking-wider font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Voltar ao Menu
        </button>

        <div id="envelope" class="envelope-container">
            <div class="instruction absolute -top-16 w-full text-center tracking-widest uppercase font-bold text-slate-400 text-xs transition-opacity duration-300">
                A tua carta chegou<br><span class="text-[10px] font-normal opacity-70">Toque para abrir</span>
            </div>
            
            <div class="env-back"></div>
            <div class="env-letter-stub"></div>
            <div class="env-left"></div>
            <div class="env-right"></div>
            <div class="env-bottom"></div>
            <div class="env-flap-wrapper">
                <div class="env-flap shadow-sm"></div>
                <div class="wax-seal">❤</div>
            </div>
        </div>
    </div>

    <!-- MODAL DA CARTA / FOTOS (ECRÃ 3) -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-700">
        <div id="modal-content" class="relative w-[90vw] h-[90vh] max-w-2xl rounded-lg shadow-2xl overflow-hidden opacity-0 scale-75 translate-y-12 transition-all duration-700 ease-out flex flex-col">
            
            <button id="close-btn" class="absolute top-4 right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-black/20 hover:bg-black/40 text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <!-- CONTEÚDO DINÂMICO (TEXTO OU FOTOS) -->
            <div id="modal-body-container" class="h-full w-full overflow-y-auto hide-scrollbar">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // --- BANCO DE DADOS DE CARTAS E FOTOS ---
        const cartas = [
            {
                id: 1,
                dataCurta: "23/08",
                dataLonga: "23 de Agosto de 2026",
                capitulo: "Capítulo 23",
                titulo: "As minhas promessas (Pt. 1)",
                texto: "Meu xuxu,<br>Prometo que a nossa vida nunca perderá a leveza e a alegria que construímos desde aquele nosso primeiro lanche juntos. Quero continuar sendo o seu maior parceiro de todas as horas, criando as melhores cabanas com o Fred na sala e celebrando cada pequena conquista nossa com um gelato na Borelli. O meu compromisso diário é fazer você sorrir, valorizando as suas dancinhas no banho, as suas teorias loucas depois de um filme e esse seu jeito espontâneo que me conquistou. Prometo que o nosso bom humor, aquele nosso jeito único de conversar sobre tudo, será sempre o nosso maior refúgio. Estarei sempre aqui para cuidar de você, te proteger e te amar mil milhões, em cada pequeno detalhe da nossa rotina.<br><br>Com amor,<br> Murilo Augusto Ribeiro Venturato"
            },
            {
                id: 2,
                dataCurta: "24/08",
                dataLonga: "24 de Agosto de 2026",
                capitulo: "Capítulo 24",
                titulo: "As minhas promessas (Pt. 2)",
                texto: "Meu mozão,<br>Prometo cuidar de você com a mesma dedicação, empatia e amor puro que você sempre entrega a todos ao seu redor. Assim como você tem um coração gigante, eu prometo doar o meu melhor para ser o companheiro que você merece. Prometo ser um motivo de orgulho para os seus pais e valorizar sempre a mulher incrível e forte que você é. Eu prometo estar ao seu lado não apenas nos dias de glória, mas principalmente naqueles momentos difíceis em que você sentir que está com apenas dez por cento da sua energia. Prometo que o nosso amor será sempre paciente e bondoso, formando aquele cordão de três dobras que jamais se romperá. Eu sempre serei o seu abraço mais seguro.<br><br>Com amor,<br> Murilo Augusto Ribeiro Venturato"
            },
            {
                id: 3,
                            tipo: "texto",
                dataCurta: "25/08",
                dataLonga: "25 de Agosto de 2026",
                capitulo: "Capítulo 25",
                titulo: "As minhas promessas (Pt. 3)",
                texto: "Minha vida,<br>Prometo que a nossa tão sonhada viagem para Buenos Aires será apenas a primeira de muitas luas de mel e aventuras que viveremos lado a lado. Se eu precisei de quatro pedidos de namoro para chegar até aqui, prometo continuar escolhendo você e renovando o meu \"sim\" todos os dias da minha vida. E prometo até me esforçar para não estragar mais as minhas próprias surpresas antes da hora! A partir de agora, não apenas moraremos na mesma casa, nós viveremos juntos de verdade. Prometo continuar buscando ser um homem cada vez melhor para construirmos a família que sempre sonhamos. O meu coração é inteiramente seu, e eu não vejo a hora de me casar com você.<br>Com amor,<br> Murilo Augusto Ribeiro Venturato"
            },
         {
                id: 4,
                tipo: "texto",
                dataCurta: "26/08",
                dataLonga: "26 de Agosto de 2026",
                capitulo: "Capítulo 26",
                titulo: "O Nosso Momento Chegou",
                texto: "Meu dengo,<br>E estamos aqui, a apenas três dias do grande dia! Parecia que esse momento nunca ia chegar. Desde o pedido de casamento até o dia de hoje... você imaginava que já estaríamos aqui? Imagina que está tão perto? Já parou para pensar que no domingo a gente já vai estar em outro país? É, está começando a cair a ficha de que o nosso casamento já está batendo na porta.<br>Foram meses de muito estresse programando tudo, mas sábado será o nosso dia. O primeiro dia em muito, muito tempo que finalmente vamos conseguir descansar e aproveitar. Curta muito o nosso dia, porque vai dar tudo certo! As pessoas que amamos estarão lá, e todos estarão lá pela gente, para presenciar o nosso amor.<br>E você, com certeza, será a atração principal, e vai ser um festão como jamais se viu! Então, aproveite o seu dia o máximo possível. Pode começar a contagem regressiva dos últimos dias, pois o nosso momento finalmente está chegando!<br>Com amor,<br> Murilo Augusto Ribeiro Venturato"
            },
            {
                id: 5,
                tipo: "fotos", 
                dataCurta: "27/08", // A data será exibida no menu exatamente igual às outras
                dataLonga: "27 de Agosto de 2026",
                titulo: "Instantes Nossos",
                fotos: [
                    { url: "1.jpeg", legenda: "Eu te amo desde que saímos pela primeira vez!" },
                    { url: "2.jpeg", legenda: "Eu amei os nossos primeiros encontros, nossa história foi começando ali.." },
                    { url: "3.jpeg", legenda: "E no nosso encontro no Habib's? Esse dia foi especial!" },
                    { url: "4.jpeg", legenda: "Nossos passeios com o Fred foram inesquecíveis!" },
                    { url: "5.jpeg", legenda: "A  primeira vez na casa dos sogros, foi memorável!" },
                    { url: "6.jpeg", legenda: "E a nossa intimidade só aumentava cada vez mais!" },
                    { url: "7.jpeg", legenda: "A nossa primeira viagem juntos!" },
                    { url: "8.jpeg", legenda: "Quem deu a ideia doida de ir até Cordeiropólis de bike?" },
                    { url: "9.jpeg", legenda: "Eu lembro desse dia...a gente não parava de rir!" },
                    { url: "10.jpeg", legenda: "A nossa primeira celebração juntos! Só faltou eu abrir o olho para foto" },
                    { url: "11.jpeg", legenda: "O casamento do seu irmão!" },
                    { url: "12.jpeg", legenda: "Quando fomos para o congresso juntos!" },
                    { url: "13.jpeg", legenda: "A nossa segunda viagem juntos!" },
                    { url: "14.jpeg", legenda: "Viramos noivos!!!!" },
                    { url: "15.jpeg", legenda: "O nosso passeio para Piracicabahh!" },
                    { url: "16.jpeg", legenda: "E comemorando a conquista da sua mãe juntos!" },
                    { url: "17.jpeg", legenda: "E o nosso tão esperado pré-weeding" },
                    { url: "18.jpeg", legenda: "É, esse dia foi especial..." },
                    { url: "19.jpeg", legenda: "Enfim chegou o nosso chá de casa nova!" },
                    { url: "20.jpeg", legenda: "E agora estamos oficialmente casad...[2 dias]" }
                ]
            }
        ];

        // --- ELEMENTOS ---
        const screenMenu = document.getElementById('screen-menu');
        const screenEnvelope = document.getElementById('screen-envelope');
        const menuList = document.getElementById('menu-list');
        const envelope = document.getElementById('envelope');
        const btnVoltar = document.getElementById('btn-voltar');
        
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-btn');
        const modalBodyContainer = document.getElementById('modal-body-container');

        let cartaSelecionada = null;

        // --- RENDERIZAR MENU ---
        function renderMenu() {
            menuList.innerHTML = '';
            cartas.forEach((carta, index) => {
                const btn = document.createElement('button');
                btn.className = 'menu-card w-full p-4 rounded-xl flex items-center justify-between text-left cursor-pointer';
                
                // O texto do menu agora é sempre padronizado "Carta do dia [data]" para todos os itens
                const subtitulo = `Carta do dia ${carta.dataCurta}`;
                
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-400 text-lg shadow-inner border border-blue-800/50">
                            ✉️
                        </div>
                        <div>
                            <h2 class="text-lg text-white m-0 font-medium font-['Playfair_Display']">${carta.titulo}</h2>
                            <span class="text-xs text-slate-400 tracking-wider uppercase mt-0.5 inline-block">${subtitulo}</span>
                        </div>
                    </div>
                    <div class="text-slate-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                `;
                
                btn.addEventListener('click', () => selecionarCarta(index));
                menuList.appendChild(btn);
            });
        }

        function selecionarCarta(index) {
            cartaSelecionada = cartas[index];
            screenMenu.classList.add('hidden-screen');
            screenEnvelope.classList.remove('hidden-screen');
            envelope.classList.remove('open');
        }

        btnVoltar.addEventListener('click', () => {
            screenEnvelope.classList.add('hidden-screen');
            screenMenu.classList.remove('hidden-screen');
        });

        // --- ABRIR ENVELOPE ---
        envelope.addEventListener('click', () => {
            if (envelope.classList.contains('open')) return;

            envelope.classList.add('open');

            // Renderiza o conteúdo certo consoante seja Texto ou Fotos
            setTimeout(() => {
                if (cartaSelecionada.tipo === 'texto') {
                    modalBodyContainer.className = "paper-lines hide-scrollbar h-full w-full overflow-y-auto";
                    modalBodyContainer.innerHTML = `
                        <div class="header-capitulo">${cartaSelecionada.capitulo}</div>
                        <div class="header-titulo">${cartaSelecionada.titulo}</div>
                        <div class="header-data">${cartaSelecionada.dataLonga}</div>
                        <div>${cartaSelecionada.texto}</div>
                    `;
                } else {
                    // Monta a galeria Polaroid
let fotosHtml = cartaSelecionada.fotos.map((f, i) => {
                        const rotacoes = ['rotate-1', '-rotate-2', 'rotate-2', '-rotate-1'];
                        const rot = rotacoes[i % rotacoes.length];
                        return `
                            <!-- Mudei aqui: de 'w-full max-w-sm' para 'w-[80%] max-w-[280px] mx-auto' -->
                            <div class="polaroid w-[80%] max-w-[280px] mx-auto mb-6 ${rot}">
                                <div class="w-full overflow-hidden rounded bg-slate-100 flex items-center justify-center">
                                    <img src="${f.url}" alt="Foto" class="w-full h-auto rounded-sm">
                                </div>
                                <div class="polaroid-caption text-[20px]">${f.legenda}</div>
                            </div>
                        `;
                    }).join('');
                    modalBodyContainer.innerHTML = `
                        <h2 class="text-3xl text-white font-bold font-['Playfair_Display'] text-center mb-2 mt-2">${cartaSelecionada.titulo}</h2>
                        <p class="text-slate-400 text-xs tracking-widest uppercase mb-8">${cartaSelecionada.dataLonga}</p>
                        <div class="w-full max-w-md flex flex-col gap-6 pb-8">
                            ${fotosHtml}
                        </div>
                    `;
                }

                // Mostra o modal com animação
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100', 'pointer-events-auto');

                setTimeout(() => {
                    modalContent.classList.remove('scale-75', 'translate-y-12', 'opacity-0');
                    modalContent.classList.add('scale-100', 'translate-y-0', 'opacity-100');
                }, 50);
            }, 1000);
        });

        // --- FECHAR MODAL ---
        closeBtn.addEventListener('click', () => {
            modalContent.classList.remove('scale-100', 'translate-y-0', 'opacity-100');
            modalContent.classList.add('scale-75', 'translate-y-12', 'opacity-0');

            setTimeout(() => {
                modal.classList.remove('opacity-100', 'pointer-events-auto');
                modal.classList.add('opacity-0', 'pointer-events-none');
                envelope.classList.remove('open');
            }, 500);
        });

        renderMenu();
    </script>
</body>
</html>
