<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Nossas Cartas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; /* Fundo escuro elegante */
            font-family: 'Caveat', cursive;
            margin: 0;
            overflow: hidden; 
        }

        /* --- MENUS E TRANSIÇÕES --- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .hidden-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Cards do Menu */
        .menu-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .menu-card:hover, .menu-card:active {
            transform: translateY(-3px) scale(1.02);
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }

        /* --- ENVELOPE (DESIGN PREMIUM) --- */
        .envelope-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 240px;
            perspective: 1200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .envelope-container:hover { transform: scale(1.03); }

        .env-back {
            position: absolute; inset: 0;
            background-color: #0a192f; 
            border-radius: 6px;
            box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .env-letter-stub {
            position: absolute; bottom: 8px; left: 4%;
            width: 92%; height: 200px;
            background-color: #e8d5b5; 
            background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0,0,0,0.15) 31px);
            border-radius: 4px; z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .env-left {
            position: absolute; top: 0; left: 0;
            width: 50.5%; height: 100%;
            background-color: #1a4279; 
            clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 3;
            border-bottom-left-radius: 6px;
        }

        .env-right {
            position: absolute; top: 0; right: 0;
            width: 50.5%; height: 100%;
            background-color: #143563; 
            clip-path: polygon(100% 0, 100% 100%, 0 50%); z-index: 3;
            border-bottom-right-radius: 6px;
        }

        .env-bottom {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 51%;
            background-color: #12315b; 
            clip-path: polygon(0 100%, 50% 0, 100% 100%); z-index: 4;
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
        }

        .env-flap-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 51%; transform-origin: top; z-index: 5;
        }

        .env-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1f4b87; 
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top-left-radius: 6px; border-top-right-radius: 6px;
        }

        .wax-seal {
            position: absolute; bottom: -20px; left: 50%;
            transform: translateX(-50%); width: 44px; height: 44px;
            background: radial-gradient(circle at 30% 30%, #dc2626, #991b1b, #7f1d1d);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            color: #fca5a5; font-size: 22px; font-style: normal;
        }

        /* Animações Envelope */
        .envelope-container.open .env-flap-wrapper { transform: rotateX(180deg); z-index: 1 !important; transition: transform 0.6s ease-in-out 0s, z-index 0s 0.3s; }
        .envelope-container.open .env-letter-stub { transform: translateY(-80%); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s; }
        .envelope-container:not(.open) .env-flap-wrapper { transform: rotateX(0deg); z-index: 5 !important; transition: transform 0.6s ease-in-out 0.4s, z-index 0s 0.65s; }
        .envelope-container:not(.open) .env-letter-stub { transform: translateY(0); transition: transform 0.4s ease-in-out 0s; }
        .envelope-container.open .instruction { opacity: 0; }

        /* --- FOLHA E TEXTO --- */
        .paper-lines {
            background-color: #e8d5b5; 
            background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0, 0, 0, 0.4) 31px);
            background-attachment: local; 
            padding: 31px 24px;
            line-height: 31px; 
            font-size: 24px;
            color: #1e293b;
        }

        .header-capitulo { text-align: center; font-size: 22px; font-weight: 700; line-height: 31px; text-transform: uppercase; letter-spacing: 2px; color: #475569; }
        .header-titulo { text-align: center; font-size: 38px; font-weight: 700; line-height: 62px; color: #0f172a; }
        .header-data { text-align: right; font-size: 20px; line-height: 31px; color: #64748b; margin-bottom: 31px; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

    <!-- ECRÃ 1: MENU PRINCIPAL -->
    <div id="screen-menu" class="screen">
        <h1 class="text-4xl text-slate-200 mb-2 font-bold">As Nossas Cartas</h1>
        <p class="text-slate-500 mb-8 font-sans text-sm tracking-widest uppercase">Escolhe uma data para ler</p>
        
        <!-- Lista de Cartas (Preenchida pelo JS) -->
        <div id="menu-list" class="w-full max-w-md px-6 flex flex-col gap-4 overflow-y-auto hide-scrollbar max-h-[70vh]">
            <!-- Os botões entram aqui -->
        </div>
    </div>

    <!-- ECRÃ 2: ENVELOPE -->
    <div id="screen-envelope" class="screen hidden-screen">
        <!-- Botão Voltar -->
        <button id="btn-voltar" class="absolute top-8 left-6 text-slate-400 hover:text-white font-sans text-sm flex items-center gap-2 transition-colors z-10 uppercase tracking-wider font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Voltar
        </button>

        <!-- Envelope Animado -->
        <div id="envelope" class="envelope-container">
            <div class="instruction absolute -top-16 w-full text-center tracking-widest uppercase font-bold text-slate-400 text-sm transition-opacity duration-300">
                A tua carta chegou<br><span class="text-xs font-normal opacity-70">Toque para abrir</span>
            </div>
            
            <div class="env-back"></div>
            <div class="env-letter-stub"></div>
            <div class="env-left"></div>
            <div class="env-right"></div>
            <div class="env-bottom"></div>
            <div class="env-flap-wrapper">
                <div class="env-flap shadow-sm"></div>
                <div class="wax-seal">❤</div>
            </div>
        </div>
    </div>

    <!-- MODAL DA CARTA LIDA (ECRÃ 3) -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-lg opacity-0 pointer-events-none transition-opacity duration-700">
        <div id="modal-content" class="relative w-[90vw] h-[90vh] max-w-2xl rounded-md shadow-2xl overflow-hidden opacity-0 scale-75 translate-y-12 transition-all duration-700 ease-out flex flex-col">
            
            <button id="close-btn" class="absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-full bg-slate-900/10 hover:bg-slate-900/30 text-slate-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <!-- Textos injetados aqui -->
            <div class="paper-lines hide-scrollbar h-full w-full overflow-y-auto">
                <div id="carta-capitulo" class="header-capitulo"></div>
                <div id="carta-titulo" class="header-titulo"></div>
                <div id="carta-data" class="header-data"></div>
                <div id="carta-corpo"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. BANCO DE DADOS DAS CARTAS ---
        // Podes adicionar quantas cartas quiseres aqui!
        const cartas = [
            {
                id: 1,
                dataCurta: "21/08",
                dataLonga: "21 de Agosto de 2026",
                capitulo: "Capítulo 1",
                titulo: "O Início de Tudo",
                texto: "Meu amor,<br><br>Hoje é o dia 21, e não podia deixar de escrever. Lembras-te de quando começámos esta jornada? Parecia apenas um detalhe, mas tornou-se no nosso mundo inteiro.<br><br>Esta é a primeira carta do nosso menu interativo. Agora as cartas estão organizadas e podes escolher qual queres ler.<br><br>Amo-te muito."
            },
            {
                id: 2,
                dataCurta: "23/08",
                dataLonga: "23 de Agosto de 2026",
                capitulo: "Capítulo 15",
                titulo: "Saudades Tuas",
                texto: "Meu amor,<br><br>O dia de hoje foi longo e tudo o que eu queria era o teu abraço. O tempo passa devagar quando não estamos juntos.<br><br>Fiz questão de guardar este momento nesta carta, para que saibas que estás nos meus pensamentos a cada segundo do dia.<br><br>Volta rápido."
            },
            {
                id: 3,
                dataCurta: "25/08",
                dataLonga: "25 de Agosto de 2026",
                capitulo: "Capítulo 23",
                titulo: "A Nossa História",
                texto: "Meu amor,<br><br>Aqui está o design final que construímos. Um menu elegante, um envelope safira perfeito e uma folha onde cada palavra assenta milimetricamente nas linhas.<br><br>Sempre que sentires saudades, basta abrires este link, escolheres a data e leres o que tenho para te dizer.<br><br>Com todo o meu coração,<br>O teu amor."
            }
        ];

        // --- 2. ELEMENTOS DA INTERFACE ---
        const screenMenu = document.getElementById('screen-menu');
        const screenEnvelope = document.getElementById('screen-envelope');
        const menuList = document.getElementById('menu-list');
        
        const envelope = document.getElementById('envelope');
        const btnVoltar = document.getElementById('btn-voltar');
        
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-btn');

        // Elementos de Texto da Carta
        const elCapitulo = document.getElementById('carta-capitulo');
        const elTitulo = document.getElementById('carta-titulo');
        const elData = document.getElementById('carta-data');
        const elCorpo = document.getElementById('carta-corpo');

        // --- 3. INICIALIZAR O MENU ---
        function renderMenu() {
            menuList.innerHTML = ''; // Limpa a lista
            cartas.forEach((carta, index) => {
                // Criação do botão de cada carta
                const btn = document.createElement('button');
                btn.className = 'menu-card w-full p-4 rounded-xl flex items-center justify-between text-left cursor-pointer';
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-400 font-sans shadow-inner border border-blue-800/50">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                        </div>
                        <div>
                            <h2 class="text-xl text-white m-0 leading-none">${carta.titulo}</h2>
                            <span class="text-sm text-slate-400 font-sans tracking-widest uppercase mt-1 inline-block">Carta do dia ${carta.dataCurta}</span>
                        </div>
                    </div>
                    <div class="text-slate-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                `;
                
                // Ao clicar, prepara a carta e muda de ecrã
                btn.addEventListener('click', () => abrirEnvelope(index));
                menuList.appendChild(btn);
            });
        }

        // --- 4. LÓGICA DE NAVEGAÇÃO ---
        function abrirEnvelope(index) {
            const carta = cartas[index];
            
            // Injeta os dados da carta no HTML
            elCapitulo.innerHTML = carta.capitulo;
            elTitulo.innerHTML = carta.titulo;
            elData.innerHTML = carta.dataLonga;
            elCorpo.innerHTML = carta.texto;

            // Esconde Menu, Mostra Envelope
            screenMenu.classList.add('hidden-screen');
            screenEnvelope.classList.remove('hidden-screen');
            
            // Garante que o envelope está fechado ao entrar
            envelope.classList.remove('open');
        }

        // Voltar ao Menu
        btnVoltar.addEventListener('click', () => {
            screenEnvelope.classList.add('hidden-screen');
            screenMenu.classList.remove('hidden-screen');
        });

        // Clicar no Envelope para Abrir a Carta
        envelope.addEventListener('click', () => {
            if (envelope.classList.contains('open')) return;

            envelope.classList.add('open');

            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100', 'pointer-events-auto');

                setTimeout(() => {
                    modalContent.classList.remove('scale-75', 'translate-y-12', 'opacity-0');
                    modalContent.classList.add('scale-100', 'translate-y-0', 'opacity-100');
                }, 50);
            }, 1000); 
        });

        // Fechar o Modal (Volta para o ecrã do envelope)
        closeBtn.addEventListener('click', () => {
            modalContent.classList.remove('scale-100', 'translate-y-0', 'opacity-100');
            modalContent.classList.add('scale-75', 'translate-y-12', 'opacity-0');

            setTimeout(() => {
                modal.classList.remove('opacity-100', 'pointer-events-auto');
                modal.classList.add('opacity-0', 'pointer-events-none');
                envelope.classList.remove('open');
            }, 500);
        });

        // Inicializa a App
        renderMenu();

    </script>
</body>
</html>
